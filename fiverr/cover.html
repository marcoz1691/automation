<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:769px;font-family:"DejaVu Sans",Arial,sans-serif;overflow:hidden}
.c{width:1280px;height:769px;position:relative;padding:70px 72px;color:#fff;
 background:radial-gradient(circle at 85% 20%,VAR_GLOW 0,transparent 45%),linear-gradient(135deg,#0b1220 0%,#111c33 60%,#0d2a2a 100%)}
.tag{display:inline-block;background:#1dbf73;color:#05130c;font-weight:700;font-size:24px;padding:10px 22px;border-radius:40px;letter-spacing:1px}
h1{font-size:68px;line-height:1.08;margin:34px 0 24px;font-weight:800;max-width:660px}
h1 span{color:#1dbf73}
ul{list-style:none;font-size:30px;line-height:1.75;color:#d6e2f0}
li:before{content:"✓";color:#1dbf73;font-weight:800;margin-right:16px}
.name{position:absolute;left:72px;bottom:56px;font-size:26px;color:#9fb3c8}
.name b{color:#fff}
.win{position:absolute;right:64px;top:170px;width:440px;background:#0f1729;border:2px solid #24324d;border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.5);overflow:hidden}
.bar{height:42px;background:#1a2540;display:flex;align-items:center;padding:0 16px;gap:9px}
.bar i{width:13px;height:13px;border-radius:50%;display:block}
.code{padding:22px 24px;font-family:"DejaVu Sans Mono",monospace;font-size:19px;line-height:1.75;color:#c9d6e8;white-space:pre}
.k{color:#ff79c6}.f{color:#50fa7b}.s{color:#f1fa8c}.cm{color:#6272a4}
.badge{position:absolute;right:64px;bottom:56px;background:#1dbf73;color:#05130c;font-weight:800;font-size:26px;padding:14px 26px;border-radius:14px}
</style></head><body><div class="c">
<div class="tag">VAR_TAG</div>
<h1>VAR_TITLE</h1>
<ul>VAR_LIST</ul>
<div class="name">by <b>Marco Zurita</b> · AI Engineer</div>
<div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
<div class="code">VAR_CODE</div></div>
<div class="badge">VAR_BADGE</div>
</div></body></html>
